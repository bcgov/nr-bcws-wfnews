name: Build Android

# Controls when the workflow will run
on:
  workflow_call:
    inputs:
      build_environment:
        description: "Build Environment"
        type: string
        required: true
      upload_to_play_store:
        description: "Upload to Play Store"
        type: boolean
        required: true
      skip_slack_notification:
        type: boolean
        default: true
        required: false
      web_bundle_provided:
        description: "Caller already built and uploaded the mobile-web-dist artifact"
        type: boolean
        default: false
        required: false
  workflow_dispatch:
    inputs:
      build_environment:
        description: "Build Environment"
        type: choice
        options:
          - DEV
          - TEST
          - PROD
        default: "development"
      upload_to_play_store:
        description: "Upload to Play Store"
        type: boolean
        default: false

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Standalone runs build the web bundle themselves. Deploy workflows build it
  # once for both platforms and pass web_bundle_provided: true, which skips this.
  web:
    if: ${{ !inputs.web_bundle_provided }}
    uses: ./.github/workflows/mobile-web-build.yml
    with:
      build_environment: ${{ inputs.build_environment }}
    secrets: inherit

  build:
    needs: [web]
    if: ${{ always() && (needs.web.result == 'success' || needs.web.result == 'skipped') }}
    env:
      ANGULAR_DIRECTORY: ./client/wfnews-war/src/main/angular

    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.build_environment }}

    steps:
      - uses: actions/checkout@v7

      - name: Set short git commit SHA
        id: vars
        if: always()
        run: |
          calculatedSha=$(git rev-parse --short ${{ github.sha }})
          echo "::set-output name=short_sha::$calculatedSha"

      - name: Add .npmrc file
        working-directory: ${{ env.ANGULAR_DIRECTORY }}
        env:
          NPMRC: ${{ secrets.NPMRC }}
        run: echo -e "$NPMRC" > .npmrc

      - name: Add Google Services file
        working-directory: "${{ env.ANGULAR_DIRECTORY }}/android/app"
        env:
          GOOGLE_FILE: ${{ vars.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_FILE" | base64 --decode --ignore-garbage > google-services.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            client/wfnews-war/src/main/angular/package-lock.json
            client/wfnews-war/src/main/angular/package.json

      # `cache: gradle` caches ~/.gradle/caches and ~/.gradle/wrapper, so
      # `./gradlew bundleRelease` stops re-downloading the Gradle distribution and
      # the whole Android dependency set on every run.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Install app dependencies
        working-directory: ${{ env.ANGULAR_DIRECTORY }}
        run: |
          export NODE_OPTIONS="--max_old_space_size=4096"
          npm ci --legacy-peer-deps --registry=https://bwa.nrs.gov.bc.ca/int/artifactory/api/npm/nrs-virtual-npm/

      - name: Download mobile web bundle
        uses: actions/download-artifact@v8
        with:
          name: mobile-web-dist
          path: ${{ env.ANGULAR_DIRECTORY }}/dist/wfnews

      # `cap sync` is copy + update only: it consumes the prebuilt bundle in
      # dist/wfnews and does not run a web build of its own.
      - name: Sync web bundle into the native project
        working-directory: ${{ env.ANGULAR_DIRECTORY }}
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: ${{ env.ANGULAR_DIRECTORY }}/android
        run: chmod +x ./gradlew

      - name: Decode Service Account Key JSON File
        uses: timheuer/base64-to-file@v1
        id: service_account_json_decode
        with:
          fileName: "serviceAccount.json"
          encodedString: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}

      - name: Read serviceAccount.json
        id: service_account_json_read
        uses: juliangruber/read-file-action@v1
        with:
          path: ${{ steps.service_account_json_decode.outputs.filePath }}

      - name: Set Android versionCode
        working-directory: ${{ env.ANGULAR_DIRECTORY }}/android/app
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ vars.GOOGLE_PLAY_STORE_BUILD_NUMBER }}/g" build.gradle

      - name: Build with Gradle
        working-directory: ${{ env.ANGULAR_DIRECTORY }}/android
        run: ./gradlew bundleRelease

      - name: Sign AAB
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: ${{ env.ANGULAR_DIRECTORY }}/android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.KEYSTORE_CONTENT }}
          alias: ${{ secrets.KEYSTORE_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Rename and Move Signed AAB
        run: cp ${{ steps.sign_app.outputs.signedReleaseFile }} wfnews-release-${{ steps.vars.outputs.short_sha }}.aab

      - name: Upload to Play Store
        if: ${{ inputs.upload_to_play_store == true || inputs.upload_to_play_store == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ steps.service_account_json_read.outputs.content }}
          packageName: ${{ vars.PACKAGE_NAME }}
          releaseFiles: wfnews-release-${{ steps.vars.outputs.short_sha }}.aab
          track: internal
          status: completed

      - uses: actions/upload-artifact@v7
        name: Upload Build Artifact to GitHub
        with:
          name: wfnews-release-${{ steps.vars.outputs.short_sha }}.aab
          path: "wfnews-release-${{ steps.vars.outputs.short_sha }}.aab"
          retention-days: 3

      - name: "Increment Build Number for next upload"
        uses: action-pack/increment@v2
        with:
          name: "GOOGLE_PLAY_STORE_BUILD_NUMBER"
          token: ${{ secrets.VARIABLE_UPDATE_ACCESS_TOKEN }}

      - name: Post to a Slack channel
        id: slack
        if: ('!cancelled()') && inputs.skip_slack_notification == false
        uses: slackapi/slack-github-action@v1.24.0
        env:
          STATUS_EMOJI: ${{ job.status == 'success' && ':white_check_mark:' || ':x:' }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          # Slack channel id, channel name, or user id to post message.
          # See also: https://api.slack.com/methods/chat.postMessage#channels
          # You can pass in multiple channels to post to by providing a comma-delimited list of channel IDs.
          channel-id: "wildfire-build-notifier"
          slack-message: |
            :android: - ${{ steps.vars.outputs.short_sha }} : ${{ env.STATUS_EMOJI }} ${{ job.status }}
            Workflow: ${{ github.workflow }}
            Run number: ${{ github.run_number }}
            Branch: ${{ github.ref_name }}
            Environment: ${{ inputs.build_environment }}
            Upload to Play Store: ${{ inputs.upload_to_play_store }}
            Started by: ${{ github.triggering_actor }}
