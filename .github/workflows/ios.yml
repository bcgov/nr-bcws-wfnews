name: Build iOS

# Controls when the workflow will run
on:
  workflow_call:
    inputs:
      build_environment:
        description: "Build Environment"
        type: string
        required: true
      upload_to_app_store:
        description: "Upload to App Store"
        type: boolean
        required: true
      skip_slack_notification:
        type: boolean
        default: true
        required: false
      web_bundle_provided:
        description: "Caller already built and uploaded the mobile-web-dist artifact"
        type: boolean
        default: false
        required: false
  workflow_dispatch:
    inputs:
      build_environment:
        description: "Build Environment"
        type: choice
        options:
          - DEV
          - TEST
          - PROD
        default: "development"
      upload_to_app_store:
        description: "Upload to App Store"
        type: boolean
        default: false

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Standalone runs build the web bundle themselves. Deploy workflows build it
  # once for both platforms and pass web_bundle_provided: true, which skips this.
  web:
    if: ${{ !inputs.web_bundle_provided }}
    uses: ./.github/workflows/mobile-web-build.yml
    with:
      build_environment: ${{ inputs.build_environment }}
    secrets: inherit

  build:
    needs: [web]
    if: ${{ always() && (needs.web.result == 'success' || needs.web.result == 'skipped') }}
    env:
      ANGULAR_DIRECTORY: ./client/wfnews-war/src/main/angular

    runs-on: macos-latest

    environment:
      name: ${{ inputs.build_environment }}

    steps:
      - uses: actions/checkout@v7

      - name: Set short git commit SHA
        id: vars
        if: always()
        run: |
          calculatedSha=$(git rev-parse --short ${{ github.sha }})
          echo "::set-output name=short_sha::$calculatedSha"

      - name: Add .npmrc file
        working-directory: ${{ env.ANGULAR_DIRECTORY }}
        env:
          NPMRC: ${{ secrets.NPMRC }}
        run: echo -e -n "$NPMRC" > .npmrc

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            client/wfnews-war/src/main/angular/package-lock.json
            client/wfnews-war/src/main/angular/package.json

      - name: Configure ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.7
          bundler-cache: true


      # Capacitor 8 requires Xcode 26.0+. Use the image's newest stable Xcode
      # rather than pinning an exact version: the runner only installs the iOS
      # device platform for its default Xcode, so pinning an older one on the
      # image fails archiving with "iOS <version> is not installed".
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check Xcode version
        run: /usr/bin/xcodebuild -version

      - name: Install app dependencies
        working-directory: ${{ env.ANGULAR_DIRECTORY }}
        run: |
          export NODE_OPTIONS="--max_old_space_size=4096"
          npm ci --legacy-peer-deps --registry=https://bwa.nrs.gov.bc.ca/int/artifactory/api/npm/nrs-virtual-npm/

      - name: Download mobile web bundle
        uses: actions/download-artifact@v8
        with:
          name: mobile-web-dist
          path: ${{ env.ANGULAR_DIRECTORY }}/dist/wfnews

      # `cap sync` is copy + update only: it consumes the prebuilt bundle in
      # dist/wfnews and does not run a web build of its own.
      - name: Sync web bundle into the native project
        working-directory: ${{ env.ANGULAR_DIRECTORY }}
        run: npx cap sync ios

      # Podfile.lock is committed, so it is a stable key. Restored before
      # `pod install` so a cold CocoaPods spec repo does not get re-fetched on the
      # macOS runner every run.
      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: |
            client/wfnews-war/src/main/angular/ios/App/Pods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('client/wfnews-war/src/main/angular/ios/App/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods dependencies
        working-directory: ${{ env.ANGULAR_DIRECTORY }}/ios/App
        run: pod install

      - name: Add Google Services file
        working-directory: "${{ env.ANGULAR_DIRECTORY }}/ios/App/App"
        env:
          GOOGLE_FILE: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          echo -n "$GOOGLE_FILE" | base64 --decode -o GoogleService-Info.plist

      - name: Install the Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_APP_STORE_BUILD_CERTIFICATE_BASE64 }}
          IOS_BUILD_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_APP_STORE_BUILD_CERTIFICATE_PASSWD  }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_APP_STORE_BUILD_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate and provisioning profile from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$IOS_BUILD_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # apply provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Set build number
        working-directory: ${{ env.ANGULAR_DIRECTORY }}/ios/App
        run: |
          agvtool new-version -all ${{ vars.APPLE_APP_STORE_BUILD_NUMBER }}

      - name: Build archive
        working-directory: ${{ env.ANGULAR_DIRECTORY }}
        run: |
          xcodebuild -scheme "App" \
          -workspace ./ios/App/App.xcworkspace \
          -archivePath $RUNNER_TEMP/App.xcarchive \
          -sdk iphoneos \
          -configuration Release \
          -destination generic/platform=iOS \
          clean archive

      - name: Export IPA
        env:
          EXPORT_OPTIONS_PLIST: ${{ vars.EXPORT_OPTIONS_PLIST }}
        run: |
          EXPORT_OPTS_PATH=$RUNNER_TEMP/ExportOptions.plist
          echo -n "$EXPORT_OPTIONS_PLIST" | base64 --decode -o $EXPORT_OPTS_PATH
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive -exportOptionsPlist $EXPORT_OPTS_PATH -exportPath $RUNNER_TEMP/build

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: app
          path: ${{ runner.temp }}/build/App.ipa
          retention-days: 3

      - name: "Upload app to TestFlight"
        uses: apple-actions/upload-testflight-build@v1
        if: ${{ inputs.upload_to_app_store == true }}
        with:
          app-path: ${{ runner.temp }}/build/App.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER_95 }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_95 }}

      # NOTE: This step requires a github access token with access to the repository to update the variable - if this fails, the token may have expired or belong to a user without repo access
      - name: "Increment Build Number for next upload"
        uses: action-pack/increment@v2
        with:
          name: "APPLE_APP_STORE_BUILD_NUMBER"
          token: ${{ secrets.VARIABLE_UPDATE_ACCESS_TOKEN }}

      - name: Post to a Slack channel
        id: slack
        if: ('!cancelled()') && inputs.skip_slack_notification == false
        uses: slackapi/slack-github-action@v1.24.0
        env:
          STATUS_EMOJI: ${{ job.status == 'success' && ':white_check_mark:' || ':x:' }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          # Slack channel id, channel name, or user id to post message.
          # See also: https://api.slack.com/methods/chat.postMessage#channels
          # You can pass in multiple channels to post to by providing a comma-delimited list of channel IDs.
          channel-id: "wildfire-build-notifier"
          slack-message: |
            :apple_mac: - ${{ steps.vars.outputs.short_sha }} : ${{ env.STATUS_EMOJI }} ${{ job.status }}
            Workflow: ${{ github.workflow }}
            Run number: ${{ github.run_number }}
            Branch: ${{ github.ref_name }}
            Environment: ${{ inputs.build_environment }}
            Upload to App Store: ${{ inputs.upload_to_app_store }}
            App Store Build Number: ${{ inputs.build_number }}
            Started by: ${{ github.triggering_actor }}
