name: Manual Terraform Run

on:
  workflow_dispatch:
    inputs:
      IMAGE_TAG:
        description: Image tag to use
        required: false
        default: latest

# Set explicitly so the read-only token default (2026-11-30) changes nothing.
permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  terragrunt-deploy-dev:
    uses: ./.github/workflows/terragrunt.yml
    with:
      DEFAULT_APPLICATION_ENVIRONMENT: DEV
      IMAGE_TAG: ${{ inputs.IMAGE_TAG }}
      TARGET_ENV: dev

      MAX_RECEIVED_COUNT: 10
      VISIBILITY_TIMEOUT_SECONDS: 100

    secrets: inherit
