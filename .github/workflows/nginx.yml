env:
  NGINX_IMAGE_NAME: ${{ github.repository }}-nginx

on:
  workflow_call:
    inputs:
      ENVIRONMENT:
        required: true
        type: string
      TAG:
        required: false
        type: string

jobs:
  build-nginx:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.ENVIRONMENT }}
    steps:
      - uses: actions/checkout@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: retrieve Amazon TLS cert
        run: wget https://www.amazontrust.com/repository/AmazonRootCA1.pem -O docker/AmazonRootCA1.pem

      - name: Sanitize branch names
        id: sanitize
        run: |
          echo "BRANCH_SANITIZED=${{ github.ref_name }}" | sed 's/\//-/g' >> $GITHUB_OUTPUT
          echo "BASE_REF_SANITIZED=${{ github.base_ref }}" | sed 's/\//-/g' >> $GITHUB_OUTPUT

      #Build nginx image
      - name: Extract metadata (tags, labels) for nginx Docker image
        id: meta-nginx
        uses: docker/metadata-action@98669ae865ea3cffbcbaa878cf57c20bbf1c6c38
        with:
          images: ${{ vars.REGISTRY }}/${{ env.NGINX_IMAGE_NAME }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=${{inputs.TAG || format( 'pr-{0}', github.event.pull_request.number) }}

      - name: Build and push nginx Docker image
        if: ${{ inputs.TAG || github.event.pull_request.number > 0 }}
        uses: docker/build-push-action@ad44023a93711e3deb337508980b4b5e9bcdc5dc
        with:
          context: .
          file: docker/Dockerfile_nginx
          push: true
          tags: ${{ steps.meta-nginx.outputs.tags }}
          labels: ${{ steps.meta-nginx.outputs.labels }}