<div class="dialog-container">
  <h1 mat-mdc-dialog-title>Upload Image</h1>
  <div class="dialog-content" mat-dialog-content>
    <input #pdfInput hidden="true" type="file" onclick="this.value=null" (change)="pdfInputChange($event)" accept="image/*"/>
    <wfnews-button variant="secondary" label="Browse" (buttonClicked)="pdfInput.click()"></wfnews-button>
    <mat-form-field class="item-full-width" floatLabel="always">
      <mat-label class="label">Title</mat-label>
      <input matInput #input maxlength="150" type="text" placeholder="Title" [(ngModel)]="title" [value]="title" required>
      <mat-hint align="end">{{input.value?.length || 0}}/150</mat-hint>
    </mat-form-field>
  </div>
  <div class="dialog-actions" mat-dialog-actions>
    <wfnews-button variant="primary" label="Save" [disabled]="file === null"
      (buttonClicked)="save()"></wfnews-button>
    <wfnews-button variant="secondary" label="Cancel" (buttonClicked)="cancel()"></wfnews-button>
  </div>
</div>
