<div class="dialog-container">
  <h1 mat-mdc-dialog-title class="dialog-title">Publish incident</h1>
  <div mat-dialog-content class="dialog-content" >
    Are you sure you want to publish?
  </div>
  <div mat-dialog-actions class="dialog-actions">
    <wfnews-button variant="primary" label="Publish" (buttonClicked)="publish()"></wfnews-button>
    <wfnews-button variant="secondary" label="Keep Editing" (buttonClicked)="cancel()"></wfnews-button>
  </div>
</div>
