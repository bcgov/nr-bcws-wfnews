<div class="dialog-header">
    <div class="title">{{title}}</div>
    <div class="divider"></div>
</div>

<mat-dialog-content [ngClass]="mobile ? 'mobile dialog-body' : 'desktop dialog-body'">
    <ng-content></ng-content>
</mat-dialog-content>
<div class="divider-2"></div>
<div class="dialog-footer" *ngIf="showCancel || showOK">
    <div mat-dialog-actions>
        <wfnews-button variant="secondary" label="Cancel" (buttonClicked)="cancel()"></wfnews-button>
        <wfnews-button variant="primary" label="OK" (buttonClicked)="ok()"></wfnews-button>
    </div>
</div>
