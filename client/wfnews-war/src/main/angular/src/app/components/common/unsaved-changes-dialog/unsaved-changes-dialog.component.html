<div class="dialog-container">
  <h1 mat-mdc-dialog-title class="dialog-title">Warning</h1>
  <div mat-dialog-content class="dialog-content">
    <p class="subtitle">Are you sure you would like to leave this page?</p>
    If you leave this page without publishing, the information you have entered will be lost.
  </div>
  <div mat-dialog-actions class="dialog-actions">
    <wfnews-button variant="primary" label="Discard Changes"
      (buttonClicked)="close(true)"></wfnews-button>
    <wfnews-button variant="secondary" label="Keep Editing"
      (buttonClicked)="close(false)"></wfnews-button>
  </div>
</div>
