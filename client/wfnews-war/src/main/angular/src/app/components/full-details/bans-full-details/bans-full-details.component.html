<div *ngIf="banData">
  <div class="title-panel">
    <div class="full-details-title">Fire Ban on {{banData.description}} Open Fires</div>
    <p class="info" [innerHTML]="bansDecisionText"></p>
    <div class="button-row">
      <wfnews-button variant="secondary" label="View on Map"
        iconPath="/assets/images/svg-icons/map.svg" (buttonClicked)="navToMap()"></wfnews-button>
      <wfnews-button variant="secondary" label="Share"
        iconPath="/assets/images/svg-icons/share.svg" (buttonClicked)="shareMobile()"></wfnews-button>
    </div>
  </div>
  <hr>
  <div class="info-container">
    <div class="info"><img height="20" width="20" class="icon" src="/assets/images/svg-icons/calendar.svg" alt="Calendar" />Issued on {{banData.issuedDate}}</div>
    <div class="info"><img height="20" width="20" class="icon" src="/assets/images/svg-icons/location-pin.svg" alt="Location Pin" />{{banData.fireCentre}}</div>
    <div class="info"><img height="20" width="20" class="icon" src="/assets/images/svg-icons/carbon_layers.svg" alt="Layers" />BC Wildfire Fire Bans and Prohibitions Layer</div>
  </div>
  <hr>
  <!-- The same cards as the desktop page, so each text is written once. -->
  <div class="event-cards">
    <other-burning-restrictions-card></other-burning-restrictions-card>
    <category-1-fires-card *ngIf="banData.isCat1"></category-1-fires-card>
    <category-2-fires-card *ngIf="banData.isCat2"></category-2-fires-card>
    <category-3-fires-card *ngIf="banData.isCat3"></category-3-fires-card>
    <related-topics-card [links]="relatedTopicLinks"></related-topics-card>
  </div>
  <div class="bulletin" *ngIf="!bulletinDismissed">
    <p>Open the information bulletin for more details</p>
    <wfnews-button variant="primary" label="Go to"
      iconPathEnd="/assets/images/svg-icons/fluent_open.svg" (buttonClicked)="navToBulletinUrl()"></wfnews-button>
    <button type="button" class="bulletin-close" aria-label="Close" (click)="bulletinDismissed = true"><img src="/assets/images/svg-icons/carbon_cancel.svg" alt="" height="20" width="20" /></button>
  </div>
  <div class="spacer" *ngIf="!bulletinDismissed"></div>
</div>
