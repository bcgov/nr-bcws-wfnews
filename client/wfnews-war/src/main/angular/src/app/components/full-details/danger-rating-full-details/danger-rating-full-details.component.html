<div class="title-panel">
  <div class="full-details-title">{{rating}} Danger Rating</div>
  <p class="info">{{dangerDescription()}}</p>
  <div class="button-row">
    <wfnews-button variant="secondary" label="View on Map"
      iconPath="/assets/images/svg-icons/map.svg" (buttonClicked)="navToMap()"></wfnews-button>
    <wfnews-button variant="secondary" label="Share"
      iconPath="/assets/images/svg-icons/share.svg" (buttonClicked)="shareMobile()"></wfnews-button>
  </div>
</div>
<hr>
<div class="info-container">
  <div class="info"><img height="20" width="20" class="icon" src="/assets/images/svg-icons/carbon_layers.svg" alt="Layers" />BC Wildfire Danger Rating Layer</div>
</div>
<hr>
<!-- The same cards as the desktop page, so each text is written once. -->
<div class="event-cards">
  <what-is-a-danger-rating-card></what-is-a-danger-rating-card>
  <update-frequency-card></update-frequency-card>
  <industrial-activities-card></industrial-activities-card>
  <related-topics-card [links]="relatedTopicLinks"></related-topics-card>
</div>
<div class="spacer"></div>
