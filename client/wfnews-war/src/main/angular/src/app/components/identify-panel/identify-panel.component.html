<div class="identify-panel-wrapper">
    <div class="identify-panel" *ngIf="showPanel && currentIncidentRefs && currentIncidentRefs.length >= 1">
        <div class="panel-container" >
            <div class="identify-panel-title">
                <mat-icon svgIcon="arrow-left" (click)="backToBc()"></mat-icon>
                {{currentIncidentRefs.length}} {{currentIncidentRefs.length == 1 ? 'Result' : 'Results'}}
                <mat-icon svgIcon="cancel" (click)="closePanel()"></mat-icon>
            </div>
            <wfnews-identify-result-list [results]="results" layout="desktop" (selected)="enterPreview($event)"></wfnews-identify-result-list>
        </div>
        <ng-template #weatherPanelContainer></ng-template>
        <ng-template #previewContainer></ng-template>
    </div>
</div>
