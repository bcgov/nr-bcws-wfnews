<wfnews-identify-card-frame [layout]="layout" [compact]="compact" [heading]="heading">
    <wfnews-identify-card-line *ngIf="phone || p.FIRE_CENTRE_NAME" icon="location-pin">
        <span>{{p.FIRE_CENTRE_NAME ? p.FIRE_CENTRE_NAME + ' Fire Centre' : null}}</span>
    </wfnews-identify-card-line>
    <wfnews-identify-card-line icon="calendar"><span>Issued on {{formatDate(p.ACCESS_STATUS_EFFECTIVE_DATE)}}</span></wfnews-identify-card-line>
    <wfnews-identify-card-description [mode]="descriptionMode" [html]="bansInfo"></wfnews-identify-card-description>
</wfnews-identify-card-frame>
