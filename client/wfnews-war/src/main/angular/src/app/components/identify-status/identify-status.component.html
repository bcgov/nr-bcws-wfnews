<mobile-sliding-drawer *ngIf="mobile; else desktop" [isVisible]="!!status" (isVisibleChange)="!$event && closed.emit()"
    title="Results">
    <ng-container *ngTemplateOutlet="statusContent"></ng-container>
</mobile-sliding-drawer>

<ng-template #desktop>
    <div class="identify-panel">
        <div class="panel-container">
            <div class="identify-panel-title">
                Results <mat-icon svgIcon="cancel" (click)="closed.emit()"></mat-icon>
            </div>
            <ng-container *ngTemplateOutlet="statusContent"></ng-container>
        </div>
    </div>
</ng-template>

<ng-template #statusContent>
    <div class="identify-status-content" role="status">
        <ng-container *ngIf="shown === 'searching'">
            <mat-spinner [diameter]="20"></mat-spinner>
            Searching...
        </ng-container>
        <ng-container *ngIf="shown === 'empty'">No features found</ng-container>
    </div>
</ng-template>
