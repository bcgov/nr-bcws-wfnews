<div class="primary-media-item">
  <div *ngIf="showPreviewWarning">Warning: Primary Video/Image selection cannot be previewed</div>
  <div class="media" *ngIf="item">

    <img *ngIf="item.type === 'image'" class="image" id="primary-image-container" [src]="item.thumbnailUrl"
      [alt]="item.title" (error)="handleImageError()">
    <button *ngIf="item.type === 'image'" class="all-photos-button" (click)="openAllPhotos()">All photos</button>

    <iframe *ngIf="item.type === 'video'" [src]="bypassUrlSecurity(item.href)" [title]="item.title" allowfullscreen>
    </iframe>
  </div>
</div>
