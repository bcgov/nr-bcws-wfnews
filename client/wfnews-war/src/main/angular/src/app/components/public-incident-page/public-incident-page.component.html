<div *ngIf="!isLoading && !loadingFailed" class="page forPrint" >
  <div class="page-container">
    <div>
      <incident-header-panel [incident]="incident" [evacOrders]="evacOrders" [extent]="extent"></incident-header-panel>
    </div>
    <div *ngIf="!hideOnMobileView()">
      <app-incident-tabs 
        [incident]="incident" 
        [evacOrders]="evacOrders" 
        [areaRestrictions]="areaRestrictions" 
        [showImageWarning]="showImageWarning" 
        [showMapsWarning]="showMapsWarning"
        (tabChange)="onTabChange($event)"
        [selectedTabIndex]="selectedTabIndex"
        >
      </app-incident-tabs>
    </div>
    <div *ngIf="hideOnMobileView()">
      <mat-tab-group mat-stretch-tabs-mobile [headerPosition]="above" (selectedIndexChange)="onTabChange($event)">
        <mat-tab label="Details">
          <incident-info-panel-mobile *ngIf="hideOnMobileView()" [incident]="incident" [evacOrders]="evacOrders" [areaRestrictions]="areaRestrictions"></incident-info-panel-mobile>
        </mat-tab>
        <mat-tab label="Response">
          <incident-overview-panel-mobile *ngIf="hideOnMobileView()" [incident]="incident" ></incident-overview-panel-mobile>
        </mat-tab>
        <mat-tab label="Gallery">
          <ng-template matTabContent>
            <incident-gallery-panel-mobile *ngIf="hideOnMobileView()" [incident]="incident" [showImageWarning]="showImageWarning"></incident-gallery-panel-mobile>
          </ng-template>
        </mat-tab>
        <mat-tab label="Maps">
          <incident-maps-panel-mobile *ngIf="hideOnMobileView()" [incident]="incident" [showMapsWarning]="showMapsWarning"></incident-maps-panel-mobile>
        </mat-tab>
      </mat-tab-group>
      <div class="contact-section">
        <h1>Contact Us</h1>
        <div class="contact-row">
            <img height="24" width="24" src="/assets/images/centre.png" alt="centre" />
            <span>{{incident.fireCentreName}}</span>
        </div>
        <div class="contact-row">
            <img height="24" width="24" src="/assets/images/svg-icons/carbon_email.svg" alt="carbon_email" />
            <!-- A narrow screen breaks the address after the @, not inside the domain. -->
            <span *ngIf="incident.contactEmailAddress?.split('@') as parts">{{parts[0]}}<ng-container
                *ngIf="parts.length > 1">@<wbr>{{parts[1]}}</ng-container></span>
        </div>
        <div class="contact-row">
            <img height="24" width="24" src="/assets/images/svg-icons/carbon_phone.svg" alt="carbon_phone" />
            <span>{{incident.contactPhoneNumber}}</span>
        </div>
        <div class="contact-actions">
            <wfnews-button variant="secondary" label="Call Us" [fullWidth]="true"
                iconPath="/assets/images/svg-icons/carbon_phone.svg"
                (buttonClicked)="callFireCentre(incident.contactPhoneNumber)"></wfnews-button>
            <wfnews-button variant="secondary" label="Email Us" [fullWidth]="true"
                iconPath="/assets/images/svg-icons/carbon_email.svg"
                (buttonClicked)="emailFireCentre(incident.contactEmailAddress)"></wfnews-button>
        </div>
    </div>
    </div>
  </div>
</div>
<div *ngIf="!isLoading && loadingFailed" class="page-container">
  failed to load...
</div>
<div *ngIf="isLoading">
  <mat-spinner style="margin: auto;" *ngIf="!loaded" [diameter]="50"></mat-spinner>
</div>
