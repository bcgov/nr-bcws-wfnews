<div class="page-content">
  <div class="rof-text-primary-header">{{ title }}</div>
  <div class="rof-text-secondary-header">{{ message }}</div>
  <div>
    <mat-label>Note</mat-label>
  </div>
  <mat-form-field class="text-container">
    <textarea matInput class="text-area" #commentText [(ngModel)]="reportOfFire[updateAttribute]" [maxLength]="maxLength" (ngModelChange)="onTextAreaChange()" (focus)="enterTextArea()" (blur)="exitTextArea()"></textarea>
    <!-- <div class="comment-divider"></div> -->
    <div class="word-count">{{commentText.value.length}}/500</div>
  </mat-form-field >


  <div class="rof-button-container" *ngIf="!isEditMode">
    <wfnews-button variant="secondary" size="large" label="Previous"
      (buttonClicked)="previous()"></wfnews-button>
    <wfnews-button variant="primary" size="large" label="Next" iconPathEnd="/assets/images/svg-icons/arrow-forward-enabled.svg"
      (buttonClicked)="next()"></wfnews-button>
  </div>

  <div class="rof-button-container" *ngIf="isEditMode">
    <wfnews-button variant="secondary" size="large" label="Cancel"
      (buttonClicked)="backToReview()"></wfnews-button>
    <wfnews-button variant="primary" size="large" label="Save" [disabled]="!isPageDirty"
      (buttonClicked)="backToReview()"></wfnews-button>
  </div>
</div>
