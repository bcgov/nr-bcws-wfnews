<div class="dialog-container">
    <div class="dialog-content" mat-dialog-content>
      <div class="item-full-width" floatLabel="always">
        <label class="label">{{ locationServicesAlert }}</label>
      </div>
    </div>
    <div class="dialog-actions" mat-dialog-actions>
        <wfnews-button variant="primary" label="OK" (buttonClicked)="close(true)"></wfnews-button>
        <wfnews-button variant="secondary" label="Cancel" (buttonClicked)="close(false)"></wfnews-button>
    </div>
  </div>
