<div class="page-content" *ngIf="reportOfFire.motionSensor === 'yes' && !isLandscapeMode()">
    <div class="rof-text-primary-header">{{ title }}</div>
    <div class="rof-text-secondary-header">{{ message }}</div>
    <div id="compass-container">
        <img alt="Compass Face" [src]="compassFaceUrl" id="compass-face-image"
            [style.transform]="'rotate(' + (-compassHeading) + 'deg)'"/>
        <img alt="Compass Hand" [src]="compassHandUrl"  class="compass-hand-image"/>
    </div>
    <div class="compass-heading" id="compass-heading">{{ heading }}</div>
    <div class="location" id="location" *ngIf="currentLat && currentLong">{{ currentLat }},{{ currentLong }}</div>
    <div class="rof-button-container">
      <wfnews-button variant="secondary" size="large" label="Previous"
        (buttonClicked)="previous()"></wfnews-button>
      <wfnews-button variant="primary" size="large" label="Continue"
        (buttonClicked)="confirmHeading()"></wfnews-button>
    </div>
  </div>
  
<div class="page-content" *ngIf="compassUnsupported">
  <div class="rof-text-primary-header">{{ title }}</div>
  <div class="rof-text-secondary-header">This device or browser has no compass, so the app is unable to find the direction of the fire. You can still report the fire.</div>
  <div class="rof-button-container">
    <wfnews-button variant="secondary" size="large" label="Previous"
      (buttonClicked)="previous()"></wfnews-button>
    <wfnews-button variant="primary" size="large" label="Continue"
      (buttonClicked)="continueWithoutCompass()"></wfnews-button>
  </div>
</div>
