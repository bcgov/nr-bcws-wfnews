<div class="page-content">
  <div class="rof-text-primary-header">{{ title }}</div>
  <div class="rof-text-secondary-header">{{ message }}</div>

  <div class="divider"></div>
  <div class="rof-text-subheader-black">Do you agree to share information with the BC Wildfire Service?</div>
  <div class="rof-text-body">
    <bc-checkbox [checked]="dataShareAccepted" (change)="dataShareAcceptedToggle($event.checked)">
      <span>I agree to share information provided in this report with BC Wildfire Service</span>
    </bc-checkbox>
  </div>
  <permission-banner *ngIf="banner"
    class="location-banner"
    [class.leaving]="bannerLeaving"
    [heading]="banner.heading"
    [message]="banner.message"
    [actionLabel]="banner.action"
    [busy]="!!banner.busy"
    [success]="!!banner.success"
    (action)="onBannerAction()">
  </permission-banner>
  <div class="call-option" *ngIf="showCallOption">
    <span>{{ bannerText.location.callToReport.question }}</span>
    <wfnews-button variant="tertiary" size="small" [label]="bannerText.location.callToReport.action"
      iconPath="/assets/images/svg-icons/phone.svg" (buttonClicked)="openCallPage()"></wfnews-button>
  </div>
  <div class="rof-button-container">
    <wfnews-button variant="secondary" size="large" label="Cancel"
      (buttonClicked)="close()"></wfnews-button>
    <wfnews-button variant="primary" size="large" label="Continue"
      [disabled]="!canContinue" (buttonClicked)="nextPage()"></wfnews-button>
  </div>
</div>
