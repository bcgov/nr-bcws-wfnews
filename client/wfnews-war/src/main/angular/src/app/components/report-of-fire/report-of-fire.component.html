<div class="rof" [class.rof-scrolls]="currentPage.instance.id === 'review-page'">
  <div class="mobile-header">
    <span class="mobile-header-button"><span (click)="exit()"><mat-icon svgIcon="arrow-left" style="transform: translatey(5px); margin-right: 4px;"></mat-icon>{{exitText()}}</span></span>
    <span class="mobile-header-button"><span *ngIf="allowSkip" (click)="skip()" class="skip">Skip</span></span>
  </div>
  <div #dynamic class="page-container">
  </div>
  <div class="wrapper" *ngIf="showProgress">
    <ol class="ProgressBar">
      <li class="ProgressBar-step" *ngFor="let step of progressSteps; let i = index;">
        <svg class="ProgressBar-icon" [style]="i === currentStep-1 ? 'background-color: #123262' : ''"></svg>
      </li>
    </ol>
  </div>
</div>
