<div class="container" style="height: auto !important;">
  <div class="header-row">
    <div class="title">
      <h1>Wildfire Resources</h1>
    </div>
    <div *ngIf="!isMobileView()" class="title-button-container">
      <div class="icon-container"><mat-icon class="icon facebook" svgIcon="fb-square"></mat-icon><a style="text-decoration: none; color: #0e5fa9;" href="https://www.facebook.com/BCForestFireInfo/"
          target="_blank" rel="noopener">BC Wildfire Service</a>
        </div>
      <div class="icon-container" style="margin-top: 8px;">
        <img class="icon" src="/assets/images/svg-icons/question.svg" alt="App FAQs" style="width: 24px; height: 24px;" />
        <a style="text-decoration: none; color: #0e5fa9;" [href]="faqUrl" target="_blank" rel="noopener">App FAQs</a>
      </div>
    </div>
  </div>
  <div class="resource-container">
    <resource-panel *ngFor="let panel of resourcePanels" [panelInfo]="panel"></resource-panel>
  </div>
</div>
