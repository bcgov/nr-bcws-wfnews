<div class="dialog">
  <div class="dialog-panel">
    <div class="dialog-header">
      <div class="dialog-title">Filter by location</div>
      <mat-icon class="right-align" [mat-dialog-close]="false">close</mat-icon>
    </div>
    <div class="search-panel">
      <div class="field search-input">
        <mat-icon class="search-icon" matSuffix>search</mat-icon>
        <input [formControl]="searchByLocationControl" matInput [matAutocomplete]="auto" class="search-input" aria-label="Find Address" placeholder="Find Address" [(ngModel)]="searchText">
        <button mat-mdc-button matSuffix mat-mdc-icon-button class="input-clear-button" *ngIf="searchText" aria-label="Clear" (click)="searchText = null; locationData.useUserLocation = false; locationData.searchText = null; $event.stopPropagation()" matTooltip="Clear">
          <span class="button-wrapper"><mat-icon>close</mat-icon></span>
        </button>
          <mat-autocomplete class="location-results" #auto="matAutocomplete" (optionSelected)="onLocationSelected($event.option.value)">
              <mat-option class="location-mat-option" *ngFor="let option of filteredOptions"
                  [value]="option">
                  <div class="location-option" #locationOptions [attr.data-loc-long]="option.loc[1]" [attr.data-loc-lat]="option.loc[0]">
                      <div *ngIf="option.address !== ''">
                          <div>
                              <span class="address">{{option.address}}</span>
                          </div>
                          <div class="locality">{{option.localityName}} ({{option.localityType}})</div>
                      </div>
                      <div *ngIf="option.address === ''">
                          <div>
                              <span class="address">{{option.localityName}}</span> <span> ({{option.localityType}})</span>
                          </div>
                      </div>
                  </div>
              </mat-option>
          </mat-autocomplete>
      </div>
      <wfnews-choice-pill class="use-location" label="Use your location" [selected]="!!locationData.useUserLocation" (pillClicked)="useUserLocation()"><img src="/assets/images/svg-icons/location-button.svg" alt="" height="20" width="20" /><mat-icon iconEnd *ngIf="locationData.useUserLocation" aria-hidden="true">close</mat-icon></wfnews-choice-pill>
    </div>
    <div class="radius-panel">
      <div class="choices">
        <wfnews-choice-pill label="Within 5 km" [selected]="locationData.radius === 5" (pillClicked)="setRadius(5)"></wfnews-choice-pill>
        <wfnews-choice-pill label="Within 10 km" [selected]="locationData.radius === 10" (pillClicked)="setRadius(10)"></wfnews-choice-pill>
        <wfnews-choice-pill label="Within 20 km" [selected]="locationData.radius === 20" (pillClicked)="setRadius(20)"></wfnews-choice-pill>
        <wfnews-choice-pill label="Within 50 km" [selected]="locationData.radius === 50" (pillClicked)="setRadius(50)"></wfnews-choice-pill>
        <wfnews-choice-pill label="Within 100 km" [selected]="locationData.radius === 100" (pillClicked)="setRadius(100)"></wfnews-choice-pill>
      </div>
    </div>
  </div>
  <div class="dialog-footer" mat-dialog-actions>
    <wfnews-button variant="primary" [fullWidth]="true" label="Show Results"
      [disabled]="!searchText || searchText === ''"
      (buttonClicked)="showResults()"></wfnews-button>
  </div>
</div>
