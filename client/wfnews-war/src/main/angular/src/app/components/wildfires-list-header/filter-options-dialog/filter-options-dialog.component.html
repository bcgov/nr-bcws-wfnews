<div class="dialog">
  <div class="dialog-panel">
    <div class="dialog-header">
      <div class="dialog-title">Filters</div>
      <mat-icon class="right-align" [mat-dialog-close]="false">close</mat-icon>
    </div>
    <div class="radius-panel">
      <div class="dialog-title">Sort By</div>
      <div class="choices">
        <wfnews-choice-pill label="Wildfire Name" [selected]="filterData.sortColumn === 'incidentName'" (pillClicked)="setSortColumn('incidentName')"></wfnews-choice-pill>
        <wfnews-choice-pill label="Fire Centre" [selected]="filterData.sortColumn === 'fireCentreName'" (pillClicked)="setSortColumn('fireCentreName')"></wfnews-choice-pill>
        <wfnews-choice-pill label="Last Update" [selected]="filterData.sortColumn === 'lastUpdatedTimestamp'" (pillClicked)="setSortColumn('lastUpdatedTimestamp')"></wfnews-choice-pill>
        <wfnews-choice-pill label="Discovery Date" [selected]="filterData.sortColumn === 'discoveryDate'" (pillClicked)="setSortColumn('discoveryDate')"></wfnews-choice-pill>
      </div>
    </div>
    <div class="radius-panel">
      <div class="dialog-title">Sort By Direction</div>
      <div class="choices">
        <wfnews-choice-pill label="Descending" [selected]="filterData.sortDirection === 'DESC'" (pillClicked)="setSortDirection('DESC')"></wfnews-choice-pill>
        <wfnews-choice-pill label="Ascending" [selected]="filterData.sortDirection === 'ASC'" (pillClicked)="setSortDirection('ASC')"></wfnews-choice-pill>
      </div>
    </div>
    <div class="radius-panel">
      <div class="dialog-title">Filter By Stage of Control</div>
      <div class="choices">
        <wfnews-choice-pill label="Out of Control" [selected]="filterData.stagesOfControl.includes('OUT_CNTRL')" (pillClicked)="setStageOfControl('OUT_CNTRL')"><img height="17" width="17" src="/assets/images/svg-icons/out-of-control.svg" alt=""></wfnews-choice-pill>
        <wfnews-choice-pill label="Being Held" [selected]="filterData.stagesOfControl.includes('HOLDING')" (pillClicked)="setStageOfControl('HOLDING')"><img height="17" width="17" src="/assets/images/svg-icons/being-held.svg" alt=""></wfnews-choice-pill>
        <wfnews-choice-pill label="Under Control" [selected]="filterData.stagesOfControl.includes('UNDR_CNTRL')" (pillClicked)="setStageOfControl('UNDR_CNTRL')"><img height="17" width="17" src="/assets/images/svg-icons/under-control.svg" alt=""></wfnews-choice-pill>
        <wfnews-choice-pill label="Out" [selected]="filterData.stagesOfControl.includes('OUT')" (pillClicked)="setStageOfControl('OUT')"><img height="17" width="17" src="/assets/images/svg-icons/out-fire.svg" alt=""></wfnews-choice-pill>
      </div>
    </div>
    <div class="radius-panel">
      <div class="dialog-title">Filter By Wildfire of Note</div>
      <div class="choices">
        <wfnews-choice-pill label="Wildfire of Note" [selected]="!!filterData.fireOfNoteInd" (pillClicked)="setFireOfNoteInd()"><img height="17" width="17" src="/assets/images/svg-icons/wildfire-of-note.svg" alt=""></wfnews-choice-pill>
      </div>
    </div>
    <div class="radius-panel">
      <div class="dialog-title">Filter By Fire Centre</div>
      <div class="choices">
        <wfnews-choice-pill label="Cariboo" [selected]="filterData.fireCentre === 2" (pillClicked)="setFireCentre(2)"></wfnews-choice-pill>
        <wfnews-choice-pill label="Coastal" [selected]="filterData.fireCentre === 50" (pillClicked)="setFireCentre(50)"></wfnews-choice-pill>
        <wfnews-choice-pill label="Kamloops" [selected]="filterData.fireCentre === 25" (pillClicked)="setFireCentre(25)"></wfnews-choice-pill>
        <wfnews-choice-pill label="Northwest" [selected]="filterData.fireCentre === 42" (pillClicked)="setFireCentre(42)"></wfnews-choice-pill>
        <wfnews-choice-pill label="Prince George" [selected]="filterData.fireCentre === 8" (pillClicked)="setFireCentre(8)"></wfnews-choice-pill>
        <wfnews-choice-pill label="Southeast" [selected]="filterData.fireCentre === 34" (pillClicked)="setFireCentre(34)"></wfnews-choice-pill>
      </div>
    </div>
  </div>
  <div class="dialog-footer" mat-dialog-actions>
    <wfnews-button variant="primary" [fullWidth]="true" label="Show Results"
      (buttonClicked)="showResults()"></wfnews-button>
  </div>
</div>
