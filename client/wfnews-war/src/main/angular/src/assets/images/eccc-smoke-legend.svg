<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 65" width="320" height="65">
  <defs>
    <linearGradient id="smokeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c8d7e4"/>
      <stop offset="20%" stop-color="#9db8cf"/>
      <stop offset="40%" stop-color="#c79f5a"/>
      <stop offset="60%" stop-color="#c16847"/>
      <stop offset="80%" stop-color="#a0493f"/>
      <stop offset="100%" stop-color="#550c24"/>
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: "Noto Sans", "BCSans", "Open Sans", Verdana, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #242424;
    }
    .label {
      font-family: "Noto Sans", "BCSans", "Open Sans", Verdana, Arial, sans-serif;
      font-size: 12px;
      font-weight: 500;
      fill: #242424;
    }
    .tick {
      stroke: #484848;
      stroke-width: 1;
    }
  </style>

  <!-- Title & Unit -->
  <text x="0" y="14" class="title">PM2.5 (µg/m³)</text>

  <!-- Horizontal Color Bar -->
  <rect x="0" y="22" width="320" height="20" rx="4" ry="4" fill="url(#smokeGradient)"/>

  <!-- Ticks and Labels -->
  <line x1="2" y1="42" x2="2" y2="48" class="tick"/>
  <text x="2" y="60" text-anchor="start" class="label">1</text>

  <line x1="64" y1="42" x2="64" y2="48" class="tick"/>
  <text x="64" y="60" text-anchor="middle" class="label">10</text>

  <line x1="128" y1="42" x2="128" y2="48" class="tick"/>
  <text x="128" y="60" text-anchor="middle" class="label">25</text>

  <line x1="192" y1="42" x2="192" y2="48" class="tick"/>
  <text x="192" y="60" text-anchor="middle" class="label">50</text>

  <line x1="256" y1="42" x2="256" y2="48" class="tick"/>
  <text x="256" y="60" text-anchor="middle" class="label">100</text>

  <line x1="318" y1="42" x2="318" y2="48" class="tick"/>
  <text x="318" y="60" text-anchor="end" class="label">250+</text>
</svg>
