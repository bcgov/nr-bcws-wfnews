<svg xmlns="http://www.w3.org/2000/svg">
<!-- No viewBox: the disc scales with the image, the ring stays 1.5px white. -->
<defs><clipPath id="c"><circle cx="50%" cy="50%" r="50%"/></clipPath></defs>
<circle cx="50%" cy="50%" r="50%" fill="#FF0000" stroke="#FFFFFF" stroke-width="3" clip-path="url(#c)"/>
</svg>
