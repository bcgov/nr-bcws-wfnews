  <!--
    Two external scripts used to load here, before the application code, and they
    delayed the first screen on a weak connection. The YouTube iframe API had no
    caller at all: videos use the same-origin youtube-embed page. The Google charts
    loader now loads on demand, in GoogleChartsService.
  -->
  <!-- script>SPLASH_SCREEN.show( { title: 'NEWS' } )</script -->
  <!-- Snowplow starts plowing - Standalone vE.2.14.0 -->
  <script type="text/javascript">
    ; (function (p, l, o, w, i, n, g) {
      if (!p[i]) {
        p.GlobalSnowplowNamespace = p.GlobalSnowplowNamespace || [];
        p.GlobalSnowplowNamespace.push(i); p[i] = function () {
          (p[i].q = p[i].q || []).push(arguments)
        }; p[i].q = p[i].q || []; n = l.createElement(o); g = l.getElementsByTagName(o)[0]; n.async = 1;
        n.src = w; g.parentNode.insertBefore(n, g)
      }
    }(window, document, "script", "https://www2.gov.bc.ca/StaticWebResources/static/sp/sp-2-14-0.js", "snowplow"));
    var collector = 'spt.apps.gov.bc.ca';
    window.snowplow('newTracker', 'rt', collector, {
      appId: 'Snowplow_standalone_WFNEWS',
      cookieLifetime: 86400 * 548,
      platform: 'web',
      post: true,
      forceSecureTracker: true,
      contexts: {
        webPage: true,
        performanceTiming: true
      }
    });
    window.snowplow('enableActivityTracking', 30, 30); // Ping every 30 seconds after 30 seconds
    window.snowplow('enableLinkClickTracking');
    window.snowplow('trackPageView');
  </script>

  <!--
      Compatibility guard. MUST stay ES5-only (var / function, no arrow functions,
      no let/const, no ?. or ??) so that it still parses on the exact old WebViews
      it exists to detect. The app bundle targets Chrome 90 / iOS 15 but ships
      native ?. and ?? (Chrome 80 / Safari 13.1); below that the bundle fails to
      PARSE, so no app code runs at all and the user just sees a blank page.
      Placed after the Snowplow init above so its newTracker call is queued first.

      Two outcomes, and they are not the same fault:
        unsupported  - the engine cannot parse the bundle. Nothing here can fix it.
        boot failure - anything else, including a device that is merely slow.
                       Usually recoverable, so it offers a retry instead of blame.
    -->
  <script type="text/javascript">
    (function () {
      var shown = false;
      var BUNDLES = /(runtime|polyfills|main|scripts|vendor)\./;
      var BOOT_CEILING_MS = 30000;
      var POLL_MS = 500;

      // elapsedMs rides along in the value field so the ceiling can be tuned from
      // real timings instead of a guess.
      function report(reason, elapsedMs) {
        try {
          if (window.snowplow) {
            window.snowplow(
              'trackStructEvent',
              'compatibility',
              'unsupported_webview',
              reason,
              'userAgent',
              navigator.userAgent +
                (typeof elapsedMs === 'number' ? ' elapsedMs=' + elapsedMs : '')
            );
          }
        } catch (e) { /* telemetry must never mask the message */ }
      }

      // capacitor.config.ts overrides the user agent, so 'Android' is never in it.
      function platformAdvice() {
        var ua = navigator.userAgent || '';
        if (ua.indexOf('Android') !== -1 || ua.indexOf('bc-wildfire-android') !== -1) {
          return 'Please open the Play Store and update <strong>Android System WebView</strong> and <strong>Google Chrome</strong>, then reopen this app.';
        }
        if (/iPhone|iPad|iPod/.test(ua) || ua.indexOf('bc-wildfire-ios') !== -1) {
          return 'Please update your device to a newer version of iOS, then reopen this app.';
        }
        return 'Please update your browser to a newer version, then reload this page.';
      }

      function paint(html, afterAttach) {
        var el = document.createElement('div');
        el.setAttribute('id', 'wfnews-unsupported');
        el.setAttribute('style', [
          'position:fixed', 'top:0', 'left:0', 'right:0', 'bottom:0',
          'z-index:2147483647', 'background:#ffffff', 'color:#242424',
          'font-family:BCSans,Verdana,Arial,sans-serif', 'font-size:16px',
          'line-height:1.5', 'padding:24px', 'overflow:auto',
          '-webkit-box-sizing:border-box', 'box-sizing:border-box'
        ].join(';'));
        el.innerHTML = html;

        function attach() {
          document.body.appendChild(el);
          if (afterAttach) { afterAttach(el); }
        }

        if (document.body) {
          attach();
        } else {
          document.addEventListener('DOMContentLoaded', attach);
        }
      }

      // The engine cannot parse the bundle. A reload would fail the same way.
      function showUnsupported(reason) {
        if (shown) { return; }
        shown = true;
        report(reason);
        paint(
          '<div style="max-width:32em;margin:10vh auto 0 auto">' +
          '<h1 style="font-size:20px;margin:0 0 16px 0">This app needs a newer browser</h1>' +
          '<p style="margin:0 0 16px 0">The BC Wildfire Service app uses features your current browser does not support, so it cannot load.</p>' +
          '<p style="margin:0 0 16px 0">' + platformAdvice() + '</p>' +
          '<p style="margin:0;color:#606060;font-size:13px">If the problem continues after updating, contact BC Wildfire Service support.</p>' +
          '</div>'
        );
      }

      // Everything else. Do not blame the browser for a slow device or a lost asset.
      function showBootFailure(reason, elapsedMs) {
        if (shown) { return; }
        shown = true;
        report(reason, elapsedMs);
        paint(
          '<div style="max-width:32em;margin:10vh auto 0 auto">' +
          '<h1 style="font-size:20px;margin:0 0 16px 0">The app could not start</h1>' +
          '<p style="margin:0 0 16px 0">Something stopped the BC Wildfire Service app from loading. This is usually temporary.</p>' +
          '<p style="margin:0 0 16px 0"><button id="wfnews-retry" type="button" style="font:inherit;padding:10px 20px;border:0;border-radius:4px;background:#1a5a96;color:#ffffff;cursor:pointer">Try again</button></p>' +
          '<p style="margin:0;color:#606060;font-size:13px">If it keeps happening, check your connection, or contact BC Wildfire Service support.</p>' +
          '</div>',
          function () {
            var btn = document.getElementById('wfnews-retry');
            if (btn) {
              btn.onclick = function () { window.location.reload(); };
            }
          }
        );
      }

      // 1. Syntax probe. Exercises the exact syntax that kills the bundle,
      //    without putting that syntax in this script. Kept inside new Function
      //    so this file stays parseable everywhere. Syntax cannot be polyfilled:
      //    the file carrying the fix would fail to parse alongside the bundle.
      try {
        new Function('var a = null; return a?.b ?? 1;')();
      } catch (e) {
        var evalBlocked = false;
        try { new Function('return 1;')(); } catch (e2) { evalBlocked = true; }
        // If plain new Function also fails we are behind a CSP without
        // 'unsafe-eval', not on an old engine - say nothing and let the
        // watchdog below decide.
        if (!evalBlocked) { showUnsupported('syntax'); }
      }

      // 1b. esri-leaflet's request path calls String.prototype.replaceAll
      //     (Chrome 85 / Safari 13.1). That is an API, not syntax, so supply it
      //     rather than refuse to start over a missing function.
      if (typeof String.prototype.replaceAll !== 'function') {
        String.prototype.replaceAll = function (search, replacement) {
          if (Object.prototype.toString.call(search) === '[object RegExp]') {
            return this.replace(search, replacement);  // caller must pass a global regex
          }
          return this.split(search).join(replacement);
        };
        report('polyfilled-replaceAll');
      }

      // 2. Boot watchdog. A bundle error is proof of failure, so it fires at once.
      //    Absence of proof only waits: a slow device is not a broken one, and the
      //    poll stops the moment the app renders or main.ts sets its flag.
      var sawBundleError = false;
      window.addEventListener('error', function (ev) {
        // A script that fails to LOAD raises a plain Event with no filename - the
        // URL is on target.src. Only a thrown error carries filename. Reading just
        // filename missed every failed load and made them wait out the ceiling.
        var target = ev && ev.target;
        var src = (ev && ev.filename) || (target && target.src) || '';
        if (!BUNDLES.test(src)) { return; }   // ignore youtube / gstatic / etc
        sawBundleError = true;
        if (ev.error instanceof SyntaxError) { showUnsupported('bundle-syntax-error'); }
      }, true);

      function booted() {
        var root = document.getElementById('app-root');
        return !!window.__wfnewsBooted || !!(root && root.children.length > 0);
      }

      function armWatchdog() {
        var started = new Date().getTime();
        var timer = setInterval(function () {
          var elapsed = new Date().getTime() - started;

          if (booted()) { clearInterval(timer); return; }

          if (sawBundleError) {
            clearInterval(timer);
            showBootFailure('boot-failed-with-error', elapsed);
            return;
          }

          if (elapsed > BOOT_CEILING_MS) {
            clearInterval(timer);
            showBootFailure('boot-failed', elapsed);
          }
        }, POLL_MS);
      }

      if (document.readyState === 'complete') {
        armWatchdog();
      } else {
        window.addEventListener('load', armWatchdog);
      }
    })();
  </script>
</head>

  </app-root>
