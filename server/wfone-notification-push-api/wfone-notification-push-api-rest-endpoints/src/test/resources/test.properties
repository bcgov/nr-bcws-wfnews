# TEST-ONLY placeholder values. Never packaged. Production reads real env vars and fails fast if absent.
WFONE_PUSH_NOTIFICATION_DATASOURCE_URL=jdbc:postgresql://localhost:5432/not-a-real-db
WFONE_PUSH_NOTIFICATION_DATASOURCE_USERNAME=test-only-not-a-secret
WFONE_DB_PASS=test-only-not-a-secret
WFONE_PUSH_NOTIFICATION_MAX_CONNECTIONS=5

WFONE_PUSH_ITEM_EXPIRE_HOURS=24
WFONE_PUSH_NOTIFICATION_PREFIX=test-only-prefix

# AmazonSQSClientBuilder.defaultClient() resolves the region eagerly at bean creation.
# Without this the region provider chain falls through to the EC2 instance-metadata
# endpoint, which is unreachable off AWS, and the whole web context fails to start.
# Credentials stay unresolved (they are looked up lazily, per call), so nothing talks to AWS.
aws.region=ca-central-1

WFONE_SQS_QUEUE_NOTIFICATION_URL=http://localhost:0/not-a-real-queue
WFONE_PUSH_NOTIFICATION_SQS_MONITOR_ATTRIBUTE=test-only-attribute
WFONE_PUSH_NOTIFICATION_SQS_MAX_MESSAGES=10
WFONE_PUSH_NOTIFICATION_SQS_WAIT_SECONDS=1
WFONE_PM_SQS_S3_BUCKET_NAME=test-only-bucket

WFONE_PUSH_NOTIFICATION_CONSUMER_INTERVAL_SECONDS=300

WFONE_FIREBASE_DB_URL=http://localhost:0/not-a-real-firebase
FIREBASE_CONFIG_JSON={}
